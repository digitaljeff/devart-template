<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build The Future</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap');*{box-sizing:border-box}:root{--b:#090907;--s:#11110e;--t:#f1efe8;--m:#aaa79d;--a:#d9ff43;--l:#2b2b26}body{margin:0;background:var(--b);color:var(--t);font-family:DM Sans,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.bar{height:68px;position:sticky;top:0;z-index:9;background:#090907ed;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:15px;padding:0 3vw}.logo{font-weight:600;line-height:.8;letter-spacing:-.06em}.bar .spacer{flex:1}.btn{border:1px solid var(--l);background:var(--s);color:var(--t);padding:10px 14px}.primary{background:var(--a);color:var(--b);border-color:var(--a);font-weight:600}.hero{min-height:80vh;padding:5vw 3vw;display:flex;flex-direction:column}.eyebrow,.cat{font-size:9px;color:var(--a);text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:clamp(82px,17vw,250px);line-height:.68;letter-spacing:-.09em;margin:auto 0 30px}.hero h1 span{display:block}.hero h1 span:nth-child(2){margin-left:17vw}.intro{border-top:1px solid var(--l);padding-top:20px;display:flex;justify-content:space-between;gap:30px;font:clamp(23px,3vw,40px)/1 Instrument Serif}.manifest{padding:12vw 7vw;background:var(--t);color:var(--b);font:clamp(42px,7vw,105px)/.92 Instrument Serif}.manifest i{display:block;margin-left:9vw;color:#777}.archive{padding:90px 3vw}.archive h2{font:clamp(58px,8vw,115px)/.9 Instrument Serif;margin:8px 0 35px}.tools{position:sticky;top:68px;background:var(--b);z-index:8;padding:12px 0;border-block:1px solid var(--l)}.input,.text,.select{width:100%;background:var(--b);color:var(--t);border:1px solid var(--l);padding:11px}.text{min-height:90px}.chips{display:flex;gap:7px;overflow:auto;margin-top:10px}.chip{white-space:nowrap;border:1px solid var(--l);border-radius:20px;background:none;color:var(--t);padding:7px 10px}.chip.on{background:var(--a);color:var(--b)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--l);border:1px solid var(--l);margin-top:20px}.card{background:var(--b);cursor:pointer}.pic{aspect-ratio:.82;background:#222;display:grid;place-items:center;overflow:hidden;position:relative}.pic b{font:65px Instrument Serif;color:#555}.pic img{position:absolute;width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.info{padding:15px;min-height:180px;display:flex;flex-direction:column}.info h3{font-size:27px;line-height:.95;margin:8px 0}.quote{font:17px/1.1 Instrument Serif;color:#ccc;margin:auto 0 0}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(470px,100%);background:var(--s);border:1px solid var(--l);padding:28px}.panel h1,.workspace h1{font:52px/.9 Instrument Serif;margin:8px 0 24px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:9px;color:var(--m);text-transform:uppercase}.admin{min-height:100vh}.layout{display:grid;grid-template-columns:200px 1fr}.side{border-right:1px solid var(--l);padding:15px;min-height:calc(100vh - 68px)}.nav{width:100%;border:0;background:none;color:var(--m);padding:11px;text-align:left}.nav.on{background:#1c1c18;color:var(--t)}.workspace{padding:25px;min-width:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.box{border:1px solid var(--l);background:var(--s);padding:18px}.stat b{font-size:34px}.table{overflow:auto;border:1px solid var(--l)}table{width:100%;border-collapse:collapse;min-width:720px}td,th{padding:10px;border-bottom:1px solid var(--l);text-align:left;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.modal{position:fixed;inset:0;background:#000d;z-index:30;display:grid;place-items:center;padding:18px}.sheet{width:min(850px,100%);max-height:94vh;overflow:auto;background:var(--s);border:1px solid #555;padding:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.muted{color:var(--m)}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;min-height:auto;border-right:0;border-bottom:1px solid var(--l)}.nav{width:auto;white-space:nowrap}.form{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="modal" class="modal hide"><div id="sheet" class="sheet"></div></div><script>
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal'),sheet=$('#sheet');let project,cms,tab='dashboard',cat='All',q='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=n=>n.split(/\s+/).slice(0,2).map(x=>x[0]).join(''),slug=n=>n.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');async function api(p,o={}){const r=await fetch('/api/'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x}function theme(){const t=project.settings.theme;for(const [k,v] of Object.entries({b:t.background,s:t.surface,t:t.text,m:t.muted,a:t.accent,l:t.line}))document.documentElement.style.setProperty('--'+k,v)}function msg(x){alert(x)}
async function boot(){if(location.search.includes('admin'))return adminBoot();const x=await api('public/content');if(x.gate)return gate(x);project=x.project;theme();publicView()}function gate(x){app.innerHTML=`<div class=gate><form class=panel id=g><h1>${x.gate==='maintenance'?'Updating':'Private preview'}</h1><p>${esc(x.message)}</p>${x.gate==='passcode'?'<input class=input name=passcode type=password required><br><button class="btn primary">Enter</button>':''}</form></div>`;if(x.gate==='passcode')$('#g').onsubmit=async e=>{e.preventDefault();try{await api('public/access',{method:'POST',body:JSON.stringify({passcode:e.target.passcode.value})});boot()}catch(er){msg(er.message)}}}
function publicView(){const s=project.settings,p=project.people.filter(x=>x.status==='published'),cats=project.categories.filter(x=>x.visible!==false);app.innerHTML=`<header class=bar><b class=logo>${esc(s.logoLine1)}<br>${esc(s.logoLine2)}</b><span class=spacer></span><a href=#archive>THE ARCHIVE</a></header><section class=hero><div class=eyebrow>${esc(s.heroEyebrow)}</div><h1><span>${esc(s.heroLine1)}</span><span>${esc(s.heroLine2)}</span><span>${esc(s.heroLine3)}</span></h1><div class=intro><span>${esc(s.heroDescription)}</span><b>${p.length}</b></div></section><section class=manifest>${esc(s.manifesto1)}<i>${esc(s.manifesto2)}</i></section><section class=archive id=archive><div class=eyebrow>${esc(s.archiveEyebrow)}</div><h2>${esc(s.archiveTitle)}</h2><div class=tools><input class=input id=search placeholder="Search a builder or field…"><div class=chips id=chips></div></div><div class=grid id=grid></div></section>`;$('#chips').innerHTML=['All',...cats.map(x=>x.name)].map(x=>`<button class="chip ${x==='All'?'on':''}" data-c="${esc(x)}">${esc(x)}</button>`).join('');$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()};$('#search').oninput=e=>{q=e.target.value.toLowerCase();draw()};draw()}
function draw(){const cm=Object.fromEntries(project.categories.map(x=>[x.id,x.name]));const list=project.people.filter(p=>p.status==='published'&&(cat==='All'||cm[p.categoryId]===cat)&&(!q||(`${p.name} ${p.quote} ${cm[p.categoryId]}`).toLowerCase().includes(q)));$('#grid').innerHTML=list.map(p=>`<article class=card data-id="${p.id}"><div class=pic><b>${ini(p.name)}</b>${p.photoUrl?`<img src="${esc(p.photoUrl)}">`:''}</div><div class=info><span class=cat>${esc(cm[p.categoryId]||'')}</span><h3>${esc(p.name)}</h3><p class=quote>“${esc(p.quote)}”</p></div></article>`).join('');$('#grid').onclick=e=>{const c=e.target.closest('[data-id]');if(c)showProfile(project.people.find(x=>x.id===c.dataset.id))}}
function showProfile(p){sheet.innerHTML=`<button class=btn onclick=closeModal()>Close</button><h1>${esc(p.name)}</h1><blockquote style="font:40px Instrument Serif">“${esc(p.quote)}”</blockquote><p>${esc(p.bio||p.summary||'Biography pending.')}</p>`;modal.classList.remove('hide')}function closeModal(){modal.classList.add('hide')}
async function adminBoot(){const s=await api('auth/status');if(s.setupRequired)return setup();if(!s.loggedIn)return login();cms=await api('admin/content');project=cms.draft;theme();adminView()}function setup(){const token=new URLSearchParams(location.search).get('setup')||'';app.innerHTML=`<div class=gate><form class=panel id=set><h1>Create password</h1><input class=input value="jeff@labs.vip" readonly><div class=field><label>Password</label><input class=input name=p type=password minlength=10 required></div><button class="btn primary" ${token?'':'disabled'}>Create account</button></form></div>`;$('#set').onsubmit=async e=>{e.preventDefault();try{await api('auth/setup',{method:'POST',body:JSON.stringify({email:'jeff@labs.vip',password:e.target.p.value,token})});location.href='/?admin=1'}catch(er){msg(er.message)}}}function login(){app.innerHTML=`<div class=gate><form class=panel id=login><h1>Admin login</h1><input class=input value="jeff@labs.vip" readonly><div class=field><label>Password</label><input class=input name=p type=password required></div><button class="btn primary">Sign in</button></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await api('auth/login',{method:'POST',body:JSON.stringify({email:'jeff@labs.vip',password:e.target.p.value})});adminBoot()}catch(er){msg(er.message)}}}
function adminView(){app.innerHTML=`<div class=admin><header class=bar><b class=logo>BUILD<br>THE FUTURE</b><span class=spacer></span><button class=btn onclick="window.open('/')">Preview</button><button class="btn primary" id=publish>Publish</button><button class=btn id=logout>Log out</button></header><div class=layout><aside class=side>${['dashboard','people','categories','design','access','data'].map(x=>`<button class="nav ${tab===x?'on':''}" data-t=${x}>${x}</button>`).join('')}</aside><main class=workspace id=work></main></div></div>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;adminView()});$('#publish').onclick=async()=>{await save();cms=await api('admin/publish',{method:'POST'});msg('Published')};$('#logout').onclick=async()=>{await api('auth/logout',{method:'POST'});login()};views[tab]()}
const views={dashboard(){const p=project.people;$('#work').innerHTML=`<h1>Dashboard</h1><div class=stats><div class=stat><b>${p.length}</b><br>People</div><div class=stat><b>${project.categories.length}</b><br>Categories</div><div class=stat><b>${p.filter(x=>!x.photoUrl).length}</b><br>Photos needed</div><div class=stat><b>${p.filter(x=>!x.quoteVerified).length}</b><br>Quotes to verify</div></div>`},people(){work.innerHTML=`<div class=row><h1 class=grow>People</h1><button class="btn primary" id=add>+ Add</button></div><input class=input id=ps placeholder="Search people"><div class=table><table><tbody id=rows></tbody></table></div>`;const rows=()=>{$('#rows').innerHTML=project.people.filter(p=>p.name.toLowerCase().includes($('#ps').value.toLowerCase())).map(p=>`<tr><td>${p.number}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.quote).slice(0,70)}</td><td><button class=btn data-e="${p.id}">Edit</button></td></tr>`).join('');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editPerson(b.dataset.e))};$('#ps').oninput=rows;$('#add').onclick=()=>editPerson();rows()},categories(){work.innerHTML=`<div class=row><h1 class=grow>Categories</h1><button class="btn primary" id=ac>+ Add</button></div><div class=box>${project.categories.map(c=>`<p><b style="color:${c.color}">${esc(c.name)}</b> · ${project.people.filter(p=>p.categoryId===c.id).length} people <button class=btn data-ce="${c.id}">Edit</button></p>`).join('')}</div>`;$('#ac').onclick=()=>editCat();document.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>editCat(b.dataset.ce))},design(){const s=project.settings,t=s.theme;work.innerHTML=`<h1>Design</h1><form class=box id=df><div class=field><label>Hero description</label><textarea class=text name=hero>${esc(s.heroDescription)}</textarea></div>${['background','surface','text','muted','accent','line'].map(k=>`<div class=field><label>${k}</label><input type=color name=${k} value="${t[k]}"></div>`).join('')}<button class="btn primary">Save draft</button></form>`;$('#df').onsubmit=e=>{e.preventDefault();s.heroDescription=e.target.hero.value;for(const k of ['background','surface','text','muted','accent','line'])t[k]=e.target[k].value;theme();save();msg('Saved')}},access(){const a=project.settings.access;work.innerHTML=`<h1>Access</h1><form class=box id=af><div class=field><label>Mode</label><select class=select name=mode><option ${a.mode==='public'?'selected':''}>public</option><option ${a.mode==='passcode'?'selected':''}>passcode</option><option ${a.mode==='maintenance'?'selected':''}>maintenance</option></select></div><div class=field><label>New visitor passcode</label><input class=input name=pass type=password></div><div class=field><label>Message</label><input class=input name=message value="${esc(a.message)}"></div><button class="btn primary">Save draft</button></form>`;$('#af').onsubmit=e=>{e.preventDefault();a.mode=e.target.mode.value;a.message=e.target.message.value;if(e.target.pass.value)a.visitorPasscodePlain=e.target.pass.value;save();msg('Saved')}},data(){work.innerHTML=`<h1>Data</h1><div class=box><button class=btn id=export>Export JSON</button><p class=muted>Neon Postgres and Vercel Blob are connected.</p></div>`;$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)]));a.download='build-the-future-backup.json';a.click()}}};
function editPerson(id){const p=id?project.people.find(x=>x.id===id):{id:'person-'+crypto.randomUUID(),number:Math.max(...project.people.map(x=>x.number))+1,name:'',categoryId:project.categories[0].id,quote:'',quoteSource:'',quoteVerified:false,bio:'',photoUrl:'',photoAlt:'',photoRights:'unverified',status:'draft',featured:false,createdAt:new Date().toISOString()};sheet.innerHTML=`<button class=btn onclick=closeModal()>Close</button><h1>${id?'Edit':'Add'} person</h1><form class=form id=pf><div class=field><label>Name</label><input class=input name=name value="${esc(p.name)}" required></div><div class=field><label>Category</label><select class=select name=category>${project.categories.map(c=>`<option value="${c.id}" ${c.id===p.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field wide"><label>Quote</label><textarea class=text name=quote required>${esc(p.quote)}</textarea></div><div class=field><label>Source</label><input class=input name=source value="${esc(p.quoteSource)}"></div><div class=field><label><input type=checkbox name=verified ${p.quoteVerified?'checked':''}> Verified</label></div><div class="field wide"><label>Biography</label><textarea class=text name=bio>${esc(p.bio)}</textarea></div><div class=field><label>Photo URL</label><input class=input name=photo value="${esc(p.photoUrl)}"></div><div class=field><label>Upload photo</label><input class=input id=file type=file accept="image/*"></div><div class=field><label>Status</label><select class=select name=status>${['published','draft','archived'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary wide">Save</button></form>`;$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=async()=>{try{const x=await api('admin/upload',{method:'POST',body:JSON.stringify({name:p.name||f.name,dataUrl:r.result})});$('#pf').photo.value=x.url;msg('Uploaded')}catch(er){msg(er.message)}};r.readAsDataURL(f)};$('#pf').onsubmit=e=>{e.preventDefault();p.name=e.target.name.value;p.slug=slug(p.name);p.categoryId=e.target.category.value;p.quote=e.target.quote.value;p.quoteSource=e.target.source.value;p.quoteVerified=e.target.verified.checked;p.bio=e.target.bio.value;p.photoUrl=e.target.photo.value;p.status=e.target.status.value;p.updatedAt=new Date().toISOString();if(!id)project.people.push(p);save();closeModal();views.people()};modal.classList.remove('hide')}
function editCat(id){const c=id?project.categories.find(x=>x.id===id):{id:'cat-'+crypto.randomUUID(),name:'',color:'#d9ff43',visible:true,order:project.categories.length+1};const name=prompt('Category name',c.name);if(!name)return;c.name=name;c.slug=slug(name);c.color=prompt('Color',c.color)||c.color;if(!id)project.categories.push(c);save();views.categories()}async function save(){cms=await api('admin/content',{method:'PUT',body:JSON.stringify({draft:project,history:cms.history||[]})});project=cms.draft}boot().catch(e=>app.innerHTML=`<div class=gate><div class=panel><h1>Error</h1><p>${esc(e.message)}</p></div></div>`);
</script></body></html>
